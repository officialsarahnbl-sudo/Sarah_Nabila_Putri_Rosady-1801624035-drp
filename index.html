<!DOCTYPE html>
<html>
<head>
  <title>Jurnal Cantik 💖</title>

  <!-- font lucu -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <h1>Jurnal Harian 💕</h1>

  <textarea id="note" placeholder="Tulis harimu di sini..."></textarea>
  <button onclick="addNote()">Simpan ✨</button>

  <ul id="list"></ul>
</div>

<script src="script.js"></script>
</body>
</html>
<hr>

<div class="planner-section">
  <h2>Rencana Harian 📅</h2>

  <input type="date" id="planDate">
  <textarea id="planText" placeholder="Apa rencanamu hari ini?"></textarea>
  <button onclick="addPlan()">Tambah ✨</button>

  <ul id="planList"></ul>
</div>
